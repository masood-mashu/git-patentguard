spec_version: "0.1.0"
name: git-patentguard
version: 1.0.0
description: "Autonomous Intellectual Property Prior Art, Claim Scope & Freedom-to-Operate Sentry Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - patent-prior-art-search
  - claim-scope-evaluation

tools:
  - prior-art-similarity-scorer
  - claim-breadth-analyzer
  - patent-expiration-calculator

runtime:
  max_turns: 50
  timeout: 120

tags:
  - legal
  - patents
  - intellectual-property
  - freedom-to-operate
  - passport-challenge

metadata:
  passport_id: "aps-patentguard-01"
  passport_category: "Legal"
