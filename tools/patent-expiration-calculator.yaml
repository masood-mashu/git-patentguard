name: patent-expiration-calculator
version: 1.0.0
description: "Calculates 20-year statutory patent expiration date from initial non-provisional filing date"
input_schema:
  type: object
  properties:
    filing_year:
      type: string
      description: "Four digit integer filing year (e.g. 2020)"
  required:
    - filing_year
implementation:
  type: script
  path: patent_expiration_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
